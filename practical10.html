<!DOCTYPE html>
<html>

<head>

    <title>CSS Properties Example</title>

    <style>

        /* Body */
        body {
            background-color: lightgray;
            font-family: Arial;
            margin: 20px;
        }

        /* Heading */
        h1 {
            color: darkblue;
            text-align: center;
            background-color: lightblue;
            padding: 15px;
            border: 2px solid darkblue;
        }

        /* Paragraph */
        p {
            color: black;
            font-size: 18px;
            text-align: justify;
        }

        /* Box */
        .box {
            background-color: white;
            width: 500px;
            height: 200px;

            margin: 30px auto;
            padding: 20px;

            border: 3px solid green;
        }

        /* Sub Heading */
        h2 {
            color: green;
            font-family: Georgia;
        }

        /* Button */
        .button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: 2px solid black;
        }

    </style>

</head>

<body>

    <h1>My CSS Webpage</h1>

    <div class="box">

        <h2>About CSS</h2>

        <p>
            CSS stands for Cascading Style Sheets.
            CSS is used to design and improve the appearance
            of HTML webpages.
        </p>

        <p>
            We can change the color, background, font,
            border, margin, padding, width and height
            of HTML elements using CSS.
        </p>

        <button class="button">Learn More</button>

    </div>

</body>

</html>
