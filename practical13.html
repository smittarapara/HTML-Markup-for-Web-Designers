<!DOCTYPE html>
<html>

<head>

    <title>HTML5 Input Types and Form Validation</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightgray;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .form-box {
            background-color: white;
            width: 550px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid darkblue;
        }

        label {
            display: inline-block;
            width: 180px;
            margin-bottom: 15px;
        }

        input {
            padding: 7px;
            margin-bottom: 10px;
        }

        input[type="range"] {
            width: 200px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            margin: 5px;
        }

    </style>

</head>

<body>

    <h1>HTML5 Input Types and Form Validation</h1>

    <div class="form-box">

        <form>

            <!-- Text Input -->

            <label>Full Name:</label>

            <input
                type="text"
                name="name"
                required
                minlength="3"
                maxlength="30"
                pattern="[A-Za-z ]+"
                placeholder="Enter your name">

            <br>


            <!-- Email -->

            <label>Email:</label>

            <input
                type="email"
                name="email"
                required
                placeholder="example@gmail.com">

            <br>


            <!-- Password -->

            <label>Password:</label>

            <input
                type="password"
                name="password"
                required
                minlength="8"
                maxlength="20"
                placeholder="Enter password">

            <br>


            <!-- Date -->

            <label>Date of Birth:</label>

            <input
                type="date"
                name="dob"
                required
                min="2000-01-01"
                max="2010-12-31">

            <br>


            <!-- Number -->

            <label>Age:</label>

            <input
                type="number"
                name="age"
                required
                min="18"
                max="30">

            <br>


            <!-- Range -->

            <label>Course Rating:</label>

            <input
                type="range"
                name="rating"
                min="1"
                max="10"
                value="5">

            <br>


            <!-- Color -->

            <label>Choose Favorite Color:</label>

            <input
                type="color"
                name="color"
                value="#0000ff">

            <br>


            <!-- File Upload -->

            <label>Upload Photo:</label>

            <input
                type="file"
                name="photo"
                required
                accept="image/*">

            <br><br>


            <!-- Mobile Number -->

            <label>Mobile Number:</label>

            <input
                type="text"
                name="mobile"
                required
                minlength="10"
                maxlength="10"
                pattern="[0-9]{10}"
                placeholder="Enter 10 digit number">

            <br><br>


            <!-- Buttons -->

            <button type="submit">
                Submit
            </button>

            <button type="reset">
                Reset
            </button>

        </form>

    </div>

</body>

</html>
